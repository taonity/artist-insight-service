name: Release
on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Skip validation for this release
        type: boolean
        default: false
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      skip_tests: ${{ steps.mode.outputs.skip_tests }}
    steps:
      - id: mode
        env:
          MANUAL_SKIP: ${{ inputs.skip_tests || false }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
        run: |
          skip_tests=false
          if [[ "$MANUAL_SKIP" == "true" || "$COMMIT_MESSAGE" == *"[skip tests]"* ]]; then skip_tests=true; fi
          echo "skip_tests=$skip_tests" >> "$GITHUB_OUTPUT"
  backend-validation:
    needs: prepare
    if: needs.prepare.outputs.skip_tests != 'true'
    uses: ./.github/workflows/backend-validation.yml
  frontend-validation:
    needs: prepare
    if: needs.prepare.outputs.skip_tests != 'true'
    uses: ./.github/workflows/frontend-validation.yml
  release-prepare:
    needs: [prepare, backend-validation, frontend-validation]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.prepare.outputs.skip_tests == 'true' || (needs.backend-validation.result == 'success' && needs.frontend-validation.result == 'success')) }}
    runs-on: ubuntu-latest
    outputs:
      raw_tag: ${{ steps.version.outputs.new_tag }}
      version: ${{ steps.number.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: version
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.TAGGING_GITHUB_TOKEN }}
          WITH_V: true
          DRY_RUN: true
      - id: number
        env:
          RAW_TAG: ${{ steps.version.outputs.new_tag }}
        run: echo "version=${RAW_TAG#v}" >> "$GITHUB_OUTPUT"
  release-backend:
    needs: release-prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Build release image
        env:
          RAW_TAG: ${{ needs.release-prepare.outputs.raw_tag }}
        run: mvn -B -P build-docker-image package -DskipTests "-Dgit.tag=$RAW_TAG"
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Publish backend image
        env:
          REGISTRY: ${{ secrets.DOCKER_USERNAME }}
          VERSION: ${{ needs.release-prepare.outputs.version }}
        run: |
          docker tag "generaltao725/artist-insight-service:$VERSION" "$REGISTRY/artist-insight-service:$VERSION"
          docker tag "generaltao725/artist-insight-service:$VERSION" "$REGISTRY/artist-insight-service:latest"
          docker push "$REGISTRY/artist-insight-service:$VERSION"
          docker push "$REGISTRY/artist-insight-service:latest"
  release-frontend:
    needs: release-prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build frontend image
        env:
          REGISTRY: ${{ secrets.DOCKER_USERNAME }}
          VERSION: ${{ needs.release-prepare.outputs.version }}
        run: |
          docker build --build-arg GIT_COMMIT_SHA="$GITHUB_SHA" --build-arg GIT_COMMIT_SHORT="${GITHUB_SHA:0:7}" --build-arg GIT_BRANCH="$GITHUB_REF_NAME" --build-arg APP_VERSION="$VERSION" -t "$REGISTRY/artist-insight-frontend:$VERSION" -t "$REGISTRY/artist-insight-frontend:latest" frontend/
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Publish frontend image
        env:
          REGISTRY: ${{ secrets.DOCKER_USERNAME }}
          VERSION: ${{ needs.release-prepare.outputs.version }}
        run: |
          docker push "$REGISTRY/artist-insight-frontend:$VERSION"
          docker push "$REGISTRY/artist-insight-frontend:latest"
  release-finalize:
    needs: [release-prepare, release-backend, release-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Publish completed release tag
        env:
          RAW_TAG: ${{ needs.release-prepare.outputs.raw_tag }}
        run: |
          git tag "$RAW_TAG"
          git push origin "$RAW_TAG"
  update-erd:
    needs: release-finalize
    uses: ./.github/workflows/update-erd.yml
    with:
      force_generate: false
    permissions:
      contents: write
  deploy-stage:
    needs: release-finalize
    uses: taonity/docker-webhook/.github/workflows/deploy.yml@main
    with:
      project_name: artist-insight-service
      environment: stage
    secrets:
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
  approve-prod:
    needs: deploy-stage
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Production deployment approved"
  deploy-prod:
    needs: approve-prod
    uses: taonity/docker-webhook/.github/workflows/deploy.yml@main
    with:
      project_name: artist-insight-service
      environment: prod
    secrets:
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
  demo-screenshots:
    needs: deploy-prod
    if: ${{ !cancelled() && needs.deploy-prod.result == 'success' }}
    uses: ./.github/workflows/demo-screenshots.yml
    permissions:
      contents: write
  notify-stage:
    needs: deploy-stage
    if: ${{ always() && vars.ENABLE_DEPLOY_NOTIFICATIONS == 'true' && (needs.deploy-stage.result == 'success' || needs.deploy-stage.result == 'failure') }}
    uses: ./.github/workflows/notify.yml
    with:
      environment: stage
      status: ${{ needs.deploy-stage.result }}
    secrets:
      NTFY_URL: ${{ secrets.NTFY_URL }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
  notify-prod:
    needs: deploy-prod
    if: ${{ always() && vars.ENABLE_DEPLOY_NOTIFICATIONS == 'true' && (needs.deploy-prod.result == 'success' || needs.deploy-prod.result == 'failure') }}
    uses: ./.github/workflows/notify.yml
    with:
      environment: prod
      status: ${{ needs.deploy-prod.result }}
    secrets:
      NTFY_URL: ${{ secrets.NTFY_URL }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
