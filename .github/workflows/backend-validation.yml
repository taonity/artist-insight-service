name: Backend Validation

on:
  workflow_call:

env:
  MAVEN_ARGS: --settings "${{ github.workspace }}/.mvn/ci-settings.xml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: |
          **/pom.xml
          .mvn/*.xml

    - name: Build back-end
      run: mvn -B -pl artist-insight-service -am package -DskipTests

  tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: |
          **/pom.xml
          .mvn/*.xml

    - name: Run unit and integration tests
      run: mvn -B verify
    - name: Upload backend test reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: backend-test-reports
        path: |
          **/target/surefire-reports/
          **/target/failsafe-reports/
        if-no-files-found: warn
        retention-days: 14
