server:
  port: 8080
  use-forward-headers: true
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 12h
      cookie:
        domain: taonity.org
        name: JSESSIONID-ARTIST-INSIGHT-PROD

app:
  default-success-url: https://artist-insight.taonity.org
  login-url: https://artist-insight.taonity.org/login
  minimised-http-servlet-logging: true
  initial-user-gpt-usages: 10
  donation-credit-price: 0.1
  share-lifetime-days: 30
  console:
    owner-emails: ${CONSOLE_OWNER_EMAILS:}
    max-page-size: 100
  retention:
    audit-days: 90
    audit-cron: "0 30 3 * * *"
  initial-global-gpt-usages: 50
  csrf-cookie-name: XSRF-TOKEN-ARTIST-INSIGHT-PROD
  cookie:
    secure: true
    same-site: Lax
  dev-access:
    enabled: true
    admin-email: ${ADMIN_EMAIL}
    rate-limit:
      send-email:
        capacity: 1
        refill-duration: PT1M

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      cache:
        time-to-live: 60s
      group:
        external:
          include: spotify,openai,kofi
          show-details: always
    prometheus:
      enabled: true
  info:
    git:
      enabled: true
      mode: full
    build:
      enabled: true
  metrics:
    tags:
      application: artist-insight-service

spotify:
  healthcheck-user-id: 3126nx54y24ryqyza3qxcchi4wry

spring:
  profiles:
    group:
      local: plain-log
      container-local: postgres,stub-spotify,stub-openai,stub-kofi,stub-mail,local,container-settings
      demo: postgres,stub-spotify,stub-openai,stub-kofi,stub-mail,local,demo-data,demo-settings
      stage: postgres,prod-spotify,prod-openai,prod-kofi,prod-mail
      prod: postgres,prod-spotify,prod-openai,prod-kofi,prod-mail
  session:
    jdbc:
      initialize-schema: never
  application:
    name: artist-insight-service

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        git_commit: "@git.commit.id.abbrev@"
        app_version: "@project.version@"
        service: ${spring.application.name}
      stacktrace:
        root: first
        max-length: 2048
        include-common-frames: false
        include-hashes: true
  level:
    WireMock: warn