services:
  db:
    restart: unless-stopped
    cpus: "${DB_CPU_LIMIT:-0.50}"
    mem_limit: ${DB_MEMORY_LIMIT:-512m}
    memswap_limit: ${DB_MEMORY_SWAP_LIMIT:-768m}
    pids_limit: ${DB_PIDS_LIMIT:-256}
  flyway:
    restart: "no"
    cpus: "${FLYWAY_CPU_LIMIT:-0.50}"
    mem_limit: ${FLYWAY_MEMORY_LIMIT:-384m}
    memswap_limit: ${FLYWAY_MEMORY_SWAP_LIMIT:-512m}
    pids_limit: ${FLYWAY_PIDS_LIMIT:-256}
  app:
    extends:
      file: app/docker-compose.prodenv.yml
      service: ${COMPOSE_PROJECT_NAME}
    restart: unless-stopped
    pids_limit: ${BACKEND_PIDS_LIMIT:-512}
    networks:
      prodenv-shared-internal:
        aliases: ["${COMPOSE_PROJECT_NAME}-app"]
      artist-insight-shared:
        aliases: ["${COMPOSE_PROJECT_NAME}-app"]
  frontend:
    restart: unless-stopped
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-256m}
    memswap_limit: ${FRONTEND_MEMORY_SWAP_LIMIT:-384m}
    cpus: "${FRONTEND_CPU_LIMIT:-0.50}"
    pids_limit: ${FRONTEND_PIDS_LIMIT:-128}
    networks:
      prodenv-shared-internal:
        aliases: ["${COMPOSE_PROJECT_NAME}-frontend"]
  postgres-export:
    extends:
      file: backup/docker-compose.yml
      service: postgres-export
    cpus: "${EXPORT_CPU_LIMIT:-0.50}"
    mem_limit: ${EXPORT_MEMORY_LIMIT:-256m}
    memswap_limit: ${EXPORT_MEMORY_SWAP_LIMIT:-384m}
    pids_limit: ${EXPORT_PIDS_LIMIT:-128}
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
networks:
  prodenv-shared-internal:
    external: true
  artist-insight-shared:
    external: true
volumes:
  backup-staging:
    external: true
    name: ${BACKUP_STAGING_VOLUME:-prodenv-backup-staging}
