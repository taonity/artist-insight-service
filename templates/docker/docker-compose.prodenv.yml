services:
  db:
    restart: unless-stopped
    cpus: "${DB_CPU_LIMIT:-0.50}"
    mem_limit: ${DB_MEMORY_LIMIT:-512m}
    pids_limit: 256
  flyway:
    mem_limit: ${FLYWAY_MEMORY_LIMIT:-384m}
  app:
    environment:
      APP_DEFAULT_SUCCESS_URL: ${DEFAULT_SUCCESS_URL:?DEFAULT_SUCCESS_URL must be set}
      APP_LOGIN_URL: ${APP_LOGIN_URL:?APP_LOGIN_URL must be set}
      SERVER_SERVLET_SESSION_COOKIE_DOMAIN: ${SERVER_SERVLET_SESSION_COOKIE_DOMAIN:?SERVER_SERVLET_SESSION_COOKIE_DOMAIN must be set}
      SERVER_SERVLET_SESSION_COOKIE_NAME: ${SERVER_SERVLET_SESSION_COOKIE_NAME:?SERVER_SERVLET_SESSION_COOKIE_NAME must be set}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:?CSRF_COOKIE_NAME must be set}
    restart: unless-stopped
    cpus: "${BACKEND_CPU_LIMIT:-1.00}"
    pids_limit: 512
    networks:
      prodenv-shared-internal:
        aliases: ["${COMPOSE_PROJECT_NAME}-app"]
      artist-insight-shared:
        aliases: ["${COMPOSE_PROJECT_NAME}-app"]
  frontend:
    restart: unless-stopped
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-256m}
    cpus: "${FRONTEND_CPU_LIMIT:-0.50}"
    pids_limit: 128
    networks:
      prodenv-shared-internal:
        aliases: ["${COMPOSE_PROJECT_NAME}-frontend"]
  postgres-export:
    extends:
      file: backup/docker-compose.yml
      service: postgres-export
    mem_limit: ${EXPORT_MEMORY_LIMIT:-256m}
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
networks:
  prodenv-shared-internal:
    external: true
  artist-insight-shared:
    external: true
volumes:
  backup-staging:
    external: true
    name: ${BACKUP_STAGING_VOLUME:-prodenv-backup-staging}
