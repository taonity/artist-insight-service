services:
  db:
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 512m
    pids_limit: 256
  flyway:
    mem_limit: 384m
  app:
    restart: unless-stopped
    cpus: "1.00"
    pids_limit: 512
    networks:
      prodenv-shared-internal:
        aliases: ["${COMPOSE_PROJECT_NAME}-app"]
      artist-insight-shared:
        aliases: ["${COMPOSE_PROJECT_NAME}-app"]
  frontend:
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.50"
    pids_limit: 128
    networks:
      prodenv-shared-internal:
        aliases: ["${COMPOSE_PROJECT_NAME}-frontend"]
  postgres-export:
    extends:
      file: backup/docker-compose.yml
      service: postgres-export
    mem_limit: 256m
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
networks:
  prodenv-shared-internal:
    external: true
  artist-insight-shared:
    external: true
volumes:
  backup-staging:
    external: true
    name: ${BACKUP_STAGING_VOLUME:-prodenv-backup-staging}
