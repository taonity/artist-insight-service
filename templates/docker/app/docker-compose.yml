services:
  app:
    image: ${DOCKER_REGISTRY:-generaltao725}/artist-insight-service:${IMAGE_TAG:-latest}
    mem_limit: ${BACKEND_MEMORY_LIMIT:-768m}
    environment:
      JDK_JAVA_OPTIONS: --add-opens java.base/java.lang=ALL-UNNAMED
      JAVA_TOOL_OPTIONS: >-
        -XX:InitialRAMPercentage=${BACKEND_INITIAL_RAM_PERCENTAGE:-10.0}
        -XX:MaxRAMPercentage=${BACKEND_MAX_RAM_PERCENTAGE:-60.0}
        ${BACKEND_JAVA_EXTRA_OPTIONS:-}
      POSTGRES_ADDRESS: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-artist_insight_service}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?POSTGRES_APP_USER must be set}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD must be set}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      KOFI_VERIFICATION_TOKEN: ${KOFI_VERIFICATION_TOKEN:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-local-admin@example.com}
      ORGANISATION_EMAIL: ${ORGANISATION_EMAIL:-}
      ORGANISATION_EMAIL_PASSWORD: ${ORGANISATION_EMAIL_PASSWORD:-}
      CONSOLE_OWNER_SPOTIFY_IDS: ${CONSOLE_OWNER_SPOTIFY_IDS:-}
      APP_DEFAULT_SUCCESS_URL: ${DEFAULT_SUCCESS_URL:-http://127.0.0.1:3000}
      APP_LOGIN_URL: ${APP_LOGIN_URL:-http://127.0.0.1:3000/login}
      SERVER_SERVLET_SESSION_COOKIE_DOMAIN: ${SERVER_SERVLET_SESSION_COOKIE_DOMAIN:-127.0.0.1}
      SERVER_SERVLET_SESSION_COOKIE_NAME: ${SERVER_SERVLET_SESSION_COOKIE_NAME:-JSESSIONID-LOCAL}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-XSRF-TOKEN-LOCAL}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      APP_COOKIE_SECURE: ${COOKIE_SECURE:-true}
    command: --spring.profiles.active=${SPRING_PROFILES_ACTIVE:?SPRING_PROFILES_ACTIVE must be set}
    volumes:
      - ./config:/artist-insight-service/config:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 10s
      retries: 60
